# Stowly for iPhone: capture only. Share → Stowly posts the link to the Mac's relay topic;
# the Mac app does all the processing. Regenerate the project with `xcodegen` after editing.
name: StowlyiOS
options:
  bundleIdPrefix: com.suyash.stowly
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: 9M948DY6YS
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
packages:
  Stowly:
    path: ..
targets:
  StowlyiOS:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    dependencies:
      - package: Stowly
        product: StowlyShared
      - target: StowlyShare
    entitlements:
      path: App/Stowly.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.suyash.stowly.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.suyash.stowly.ios
        PRODUCT_NAME: Stowly
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Stowly
        AppIdentifierPrefix: $(AppIdentifierPrefix)
        NSCameraUsageDescription: Stowly uses the camera to scan the pairing code shown on your Mac.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CFBundleURLTypes:
          - CFBundleURLName: com.suyash.stowly.pair
            CFBundleURLSchemes: [stowly]
        ITSAppUsesNonExemptEncryption: false
  StowlyShare:
    type: app-extension
    platform: iOS
    sources:
      - ShareExtension
      - Shared
    dependencies:
      - package: Stowly
        product: StowlyShared
    entitlements:
      path: ShareExtension/StowlyShare.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.suyash.stowly.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.suyash.stowly.ios.share
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Stowly
        AppIdentifierPrefix: $(AppIdentifierPrefix)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
  StowlyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.suyash.stowly.ios.uitests
    dependencies:
      - target: StowlyiOS
schemes:
  StowlyiOS:
    build:
      targets:
        StowlyiOS: all
        StowlyShare: all
    test:
      targets:
        - StowlyUITests
